<title mat-dialog-title>{{ data.currentEmployee ? 'Edit Employee' : 'Add Employee' }}</title>

<form [formGroup]="form">
  <mat-dialog-content>
    <div class="employee_bio">
      <mat-form-field>
        <input
          matInput
          placeholder="First Name *"
          formControlName="firstName"
          type="text"
          required>
        <mat-error *ngIf="firstNameErrors">{{ firstNameErrors }}</mat-error>
      </mat-form-field>

      <mat-form-field>
        <input
          matInput
          placeholder="Last Name *"
          formControlName="lastName"
          type="text"
          required>
        <mat-error *ngIf="lastNameErrors">{{ lastNameErrors }}</mat-error>
      </mat-form-field>

      <mat-form-field>
        <mat-select placeholder="Job Title *" formControlName="jobTitle" required>
          <mat-option *ngFor="let jobTitle of jobTitles" [value]="jobTitle">{{ jobTitle }}</mat-option>
        </mat-select>
        <mat-error *ngIf="jobTitleErrors">{{ jobTitleErrors }}</mat-error>
      </mat-form-field>

      <mat-form-field>
        <input
          matInput
          placeholder="Years of Experience"
          formControlName="yearsExperience"
          type="number"
          min="0"
          [max]="MAX_YEARS_EXPERIENCE">
        <mat-error *ngIf="yearsExperienceErrors">{{ yearsExperienceErrors }}</mat-error>
      </mat-form-field>

      <mat-form-field>
        <input
          matInput
          placeholder="City"
          formControlName="city"
          type="text"
          [maxlength]="MAX_STRING_LENGTH">
        <mat-error *ngIf="cityErrors">{{ cityErrors }}</mat-error>
      </mat-form-field>

      <mat-form-field>
        <input
          matInput
          placeholder="Street"
          formControlName="street"
          type="text"
          [maxlength]="MAX_STRING_LENGTH">
        <mat-error *ngIf="streetErrors">{{ streetErrors }}</mat-error>
      </mat-form-field>

      <mat-form-field>
        <input
          matInput
          placeholder="Avatar URL"
          formControlName="avatarURL"
          type="url"
          [maxlength]="MAX_STRING_LENGTH">
        <mat-error *ngIf="avatarUrlErrors">{{ avatarUrlErrors }}</mat-error>
      </mat-form-field>

      <mat-form-field>
        <input
          matInput
          placeholder="Image URL"
          formControlName="imageURL"
          type="url"
          [maxlength]="MAX_STRING_LENGTH">
        <mat-error *ngIf="imageUrlErrors">{{ imageUrlErrors }}</mat-error>
      </mat-form-field>

    </div>
    
    <!-- Form validation summary -->
    <div *ngIf="form.invalid && form.touched" class="validation-summary">
      <mat-icon color="warn">warning</mat-icon>
      <span>Please fix the errors above before submitting.</span>
    </div>
    
  </mat-dialog-content>

  <mat-dialog-actions>
    <button mat-button mat-dialog-close>Cancel</button>
    <button 
      mat-raised-button 
      [mat-dialog-close]="canSubmit() ? getSanitizedFormData() : null" 
      [disabled]="!canSubmit()"
      color="primary">
      {{ data.currentEmployee ? 'Update' : 'Save' }}
    </button>
  </mat-dialog-actions>
</form>
